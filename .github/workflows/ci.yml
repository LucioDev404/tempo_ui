name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    env:
      CI_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS_GITHUB }}
      CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_GITHUB }}

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lintTempoDebug lintNotquitemyDebug lintPlayDebug --stacktrace

      - name: Build debug flavors
        run: ./gradlew assembleTempoDebug assembleNotquitemyDebug assemblePlayDebug --stacktrace --no-daemon
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS_GITHUB }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_GITHUB }}

      - name: Upload Tempo Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tempo-debug-apk
          path: app/build/outputs/apk/tempo/debug/app-tempo-debug.apk

      - name: Upload Notquitemy Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notquitemy-debug-apk
          path: app/build/outputs/apk/notquitemy/debug/app-notquitemy-debug.apk

      - name: Upload Play Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: play-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
